name: Publish Draft Release on pyproject.toml version change
permissions:
  contents: write
  pull-requests: write
  actions: write
on:
  pull_request:
    paths:
      - "pyproject.toml"  # Only run when pyproject.toml changes
    branches:
      - main  # Only run on main branch changes
    types:
      - closed

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Extract version from pyproject.toml
        run: echo "VERSION=v$(uv version --short)" >> $GITHUB_ENV
      - name: Publish GitHub Release
        run: |
          if gh release view $VERSION --repo $GITHUB_REPOSITORY >/dev/null 2>&1; then
            gh release edit $VERSION --draft=false --repo $GITHUB_REPOSITORY
          else
            gh release create $VERSION --generate-notes --repo $GITHUB_REPOSITORY
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # Events from GITHUB_TOKEN don't trigger the `release: published` workflow,
      # so start the PyPI upload explicitly (from main, building the release tag).
      - name: Trigger PyPI publish
        run: gh workflow run python-publish.yml --ref main -f tag=$VERSION --repo $GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ github.token }}
